			}
			if ((b > a && c == "-") || (b > a && b > c)) {
				if (s == 2) {
					return true;
				} else {
					return false;
				}
			}
			if ((c != "-" && c > a && c > b)) {
				if (s == 3) {
					return true;
				} else {
					return false;
				}
			}
		}
